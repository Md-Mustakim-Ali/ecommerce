# Render blueprint — the storefront, as one free web service.
#
# Deliberately a SECOND service alongside jomma-web rather than sharing one.
# Both are Next.js servers and each idles around 200-300 MB; two of them in a
# single 512 MB free instance is an out-of-memory restart loop, and the restart
# takes down payment verification along with the shop.
#
# The cost of splitting is that Render's 750 free instance-hours are per
# workspace, shared across both services. That is a real budget and the sweep
# interval on the Jomma side is what spends it — see docs/deploy.md.

services:
  - type: web
    name: ecommerce-web
    runtime: node
    # Closest Render region to Bangladesh, and the same one jomma-web uses so
    # the webhook hop between them stays inside the region.
    region: singapore
    plan: free
    branch: main
    # corepack, because package.json pins a pnpm version and Render's image
    # ships a different one.
    #
    # Migrations run here, after the build, and the order is deliberate. Before
    # it, a compile error would leave the database ahead of code that never
    # shipped; after it, a failed migration fails the deploy and the old
    # instance keeps serving. drizzle-kit is a devDependency and so is
    # typescript, which `next build` already needs — if devDependencies were
    # ever skipped the build would fail first, so this adds no new way to break.
    #
    # The consequence is that a migration can land for a deploy that later
    # fails its health check and rolls back. Keep them backward compatible —
    # add columns, do not rename or drop them in the same release as the code
    # that stops using them — so the previous version can serve the new schema.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build && pnpm db:migrate
    startCommand: pnpm start
    # Cheap, always-public, and does not touch the database — a health check
    # that queries Postgres would wake Neon on every probe and burn the free
    # compute allowance doing nothing.
    healthCheckPath: /
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production

      # Render's containers run UTC. This shop sells in Bangladesh, so a
      # `new Date().toLocaleString()` on the server rendered every timestamp six
      # hours behind — an order paid at 11:43 read 5:43 AM, and anything placed
      # after 18:00 Dhaka showed the *previous day's* date.
      #
      # It is invisible in development: every machine that builds this is
      # already on Dhaka time, so the bug exists only where nobody looks at it.
      #
      # A mitigation, not the fix. It only moves the default for code that asks
      # for no timezone, it does nothing for client components — those render
      # in the browser's zone whatever this says — and a date's correctness
      # should not depend on a dashboard setting nobody remembers. Formatting
      # that must be right goes through lib/datetime/format.ts, which names the
      # zone explicitly and is therefore the same everywhere.
      - key: TZ
        value: Asia/Dhaka

      # Neon, and it must be a Postgres 18 project: uuidv7() is the DEFAULT on
      # every primary key in this schema and does not exist before 18. Use the
      # POOLED connection string — the one with `-pooler` in the host — because
      # lib/db/index.ts sets prepare:false for transaction-mode pooling.
      - key: DATABASE_URL
        sync: false

      - key: BETTER_AUTH_SECRET
        generateValue: true
      # This service's own public URL, with the scheme. Better Auth compares
      # the request Origin against it and returns 403 INVALID_ORIGIN on a
      # mismatch, which presents as sign-in silently failing rather than as an
      # error. Set it after the first deploy names the service:
      #   https://<your-service>.onrender.com
      - key: BETTER_AUTH_URL
        sync: false

      # ── Transactional email ──────────────────────────────────────────────
      # Two providers; lib/email/index.ts prefers Gmail when it is configured.
      # Set EITHER the three GMAIL_* or the Resend pair. EMAIL_FROM is needed
      # by both.
      #
      # Gmail is the default because Resend will only send from a domain whose
      # DNS you have verified, and onrender.com is not yours. Gmail sends as
      # the account that consented, so it needs no domain. Both are HTTP APIs:
      # there is no SMTP adapter because Render blocks outbound SMTP.
      #
      # GMAIL_REFRESH_TOKEN comes from a one-time local consent, since Google
      # will not issue one non-interactively:
      #   pnpm tsx scripts/gmail-authorise.mts <client-id> <client-secret>
      #
      # Publish the Cloud project's OAuth consent screen first, or Google
      # expires the refresh token after seven days and mail stops.
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false

      # Without any provider the console adapter takes over and refuses to send
      # in production, so no receipts and no verification mail.
      #
      # Filling these in also flips `requireEmailVerification` on, because it
      # follows whether email is configured. Existing accounts with
      # email_verified = false can no longer sign in until they verify — check
      # that count before setting these on a database that already has users.
      # It is also what attaches a guest's past orders to a new account, so
      # until these exist that path never fires.
      - key: RESEND_API_KEY
        sync: false
      # On Gmail, the address that granted consent — Gmail rewrites From: to
      # match it, so anything else is ignored rather than honoured. On Resend,
      # an address on a domain verified with them or everything bounces.
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_REPLY_TO
        sync: false

      # ── Google media connections ─────────────────────────────────────────
      # Base64 of 32 random bytes, and it must decode to exactly 32 or
      # lib/media/crypto.ts throws. NOT generateValue — Render's generator does
      # not produce a 32-byte base64 key, and the failure only shows up when a
      # seller first connects Google:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('base64'))"
      #
      # Rotating it strands every existing connection; every seller has to
      # reconnect.
      - key: GOOGLE_TOKEN_ENCRYPTION_KEY
        sync: false

      # Bearer token for POST /api/media/sweep. Absent closes the endpoint
      # rather than opening it, so a forgotten value fails safe. Generated
      # here because any value over 16 characters works — nothing else needs
      # to know it except whatever pokes the endpoint.
      #
      # Render's free plan has no cron, so something external has to call it:
      # a scheduled GitHub Action is the cheapest option that actually runs.
      - key: MEDIA_SWEEP_SECRET
        generateValue: true

      # ── Observability ────────────────────────────────────────────────────
      - key: APP_ENV
        value: production
      - key: SENTRY_DSN
        sync: false

      # ── Jomma ────────────────────────────────────────────────────────────
      # JOMMA_URL is jomma-web's APP_URL.
      # JOMMA_WEBHOOK_SECRET is jomma-web's WEBHOOK_SIGNING_SECRET — the same
      # value on both sides, or every delivery fails signature verification.
      # JOMMA_API_KEY is minted in the Jomma dashboard, not generated here.
      - key: JOMMA_URL
        sync: false
      - key: JOMMA_API_KEY
        sync: false
      - key: JOMMA_WEBHOOK_SECRET
        sync: false

      # ── Cloudflare R2 ────────────────────────────────────────────────────
      # All five or none. Without them uploads fall back to local disk, which
      # on Render is wiped on every restart and every deploy.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
